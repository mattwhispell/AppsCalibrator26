; AppsCalibrator26 - APPS calibration firmware for the Pedal Box board.
; Same board / platform / framework as PedalboxRTOS26 so the ADC reads identically.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = direct
